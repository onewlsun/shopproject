{% extends "base.html" %}
{% block title %}Категории{% endblock %}

{% block content %}
<h1>Все категории</h1>

{% if categories %}
  <ul>
    {% for c in categories %}
      <li>
        <a href="{% url 'catalog:product_list_by_category' c.slug %}">
          {{ c.name }}
        </a>
      </li>
    {% endfor %}
  </ul>
{% else %}
  <p>Категории отсутствуют.</p>
{% endif %}

{% endblock %}
