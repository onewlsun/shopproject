<h1>{{ product.name }}</h1>

<p>Цена: {{ product.price }}</p>

{% if product.old_price %}
    <p>Старая цена: {{ product.old_price }}</p>
{% endif %}

<p>{{ product.description }}</p>

{% if product.image %}
    <img src="{{ product.image.url }}" width="300">
{% endif %}

{% if product.image2 %}
    <img src="{{ product.image2.url }}" width="300">
{% endif %}

<br><br>

<a href="/">← Назад</a>
